# Jottem dev-stack (MVP-fundament) - draait op de dev-server achter Traefik.
# Tijdelijke afwijkingen t.o.v. het design: dev.iotm.nl i.p.v. www, MinIO als losstaande
# S3-object-storage. Secrets in .env (zie .env.example), nooit in git.
name: jottem

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # HTTP-01 per hostnaam: poort 80 is open en de DNS wijst al hierheen; dit vermijdt
      # de TransIP-API (gelijktijdige TXT-writes botsen daar) en propagatiewachttijden.
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jottem
      POSTGRES_PASSWORD: ${POSTGRES_WACHTWOORD}
      POSTGRES_DB: jottem
      AUTHENTIK_DB_WACHTWOORD: ${AUTHENTIK_DB_WACHTWOORD}   # voor het init-script
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jottem"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.s3.rule=Host(`s3.dev.iotm.nl`)
      - traefik.http.routers.s3.tls.certresolver=letsencrypt
      - traefik.http.services.s3.loadbalancer.server.port=9000

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set lokaal http://minio:9000 $S3_ACCESS_KEY $S3_SECRET_KEY &&
             mc mb --ignore-existing lokaal/originals lokaal/derivatives lokaal/thumbs &&
             echo buckets-klaar"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  herkenbaar:
    # detectie van herkenbare personen (portretrecht) - aparte AGPL-dienst, eigen repo
    build: https://github.com/inside-out-time-machines/herkenbaar-api.git
    restart: unless-stopped

  mongo:
    # database voor AnnoRepo (annotatieserver); niet publiek ontsloten
    image: mongo:6.0.27
    restart: unless-stopped
    volumes:
      - mongo:/data/db

  annorepo:
    # W3C Web Annotation-server (vervangt miiify uit het oorspronkelijke design, dat
    # read-only is geworden); schrijven alleen via de backend-API met de api-key,
    # lezen publiek per container (readOnlyForAnonymousUsers)
    image: ghcr.io/knaw-huc/annorepo-server:0.9.0
    restart: unless-stopped
    environment:
      AR_EXTERNAL_BASE_URL: ${ANNO_PUBLIEK:-https://anno.dev.iotm.nl}
      AR_MONGODB_URL: mongodb://mongo/
      AR_DB_NAME: annorepo
      AR_PAGE_SIZE: "100"
      AR_ROOT_API_KEY: ${ANNO_API_KEY}
      AR_PRETTY_PRINT: "false"
    depends_on:
      - mongo
    labels:
      - traefik.enable=true
      - traefik.http.routers.anno.rule=Host(`anno.dev.iotm.nl`)
      - traefik.http.routers.anno.tls.certresolver=letsencrypt
      - traefik.http.services.anno.loadbalancer.server.port=8080

  cantaloupe:
    image: uclalibrary/cantaloupe:5.0.7-0
    restart: unless-stopped
    environment:
      CANTALOUPE_BASE_URI: https://iiif.dev.iotm.nl
      CANTALOUPE_SOURCE_STATIC: S3Source
      CANTALOUPE_S3SOURCE_ENDPOINT: http://minio:9000
      CANTALOUPE_S3SOURCE_REGION: eu-central-1
      CANTALOUPE_S3SOURCE_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      CANTALOUPE_S3SOURCE_SECRET_KEY: ${S3_SECRET_KEY}
      CANTALOUPE_S3SOURCE_BASICLOOKUPSTRATEGY_BUCKET_NAME: derivatives
      CANTALOUPE_ENDPOINT_IIIF_3_ENABLED: "true"
      JAVA_OPTS: "-Xmx1g"
    depends_on:
      minio:
        condition: service_healthy

  varnish:
    image: varnish:7.6
    restart: unless-stopped
    environment:
      VARNISH_SIZE: 512M
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    depends_on:
      - cantaloupe
    labels:
      - traefik.enable=true
      - traefik.http.routers.iiif.rule=Host(`iiif.dev.iotm.nl`)
      - traefik.http.routers.iiif.tls.certresolver=letsencrypt
      - traefik.http.services.iiif.loadbalancer.server.port=80

  datapagina:
    # statische open-data-landingspagina (repo inside-out-time-machines/data,
    # working copy naast de jottem-checkout: ~/data); alles op data.dev dat niet
    # /project/* of /datacatalog (api, prio 10) of /sparql (fuseki, prio 20) is
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../../data:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.datapagina.rule=Host(`data.dev.iotm.nl`)
      - traefik.http.routers.datapagina.priority=1
      - traefik.http.routers.datapagina.tls.certresolver=letsencrypt
      - traefik.http.services.datapagina.loadbalancer.server.port=80

  fuseki:
    # triplestore voor de RDF-publicatie (schema.org AP NDE); publiek is ALLEEN het
    # /sparql-leespad via Traefik, updates lopen intern via de worker
    image: secoresearch/fuseki:6.2.0
    restart: unless-stopped
    environment:
      ENABLE_DATA_WRITE: "true"
      ENABLE_UPDATE: "true"
      ENABLE_UPLOAD: "false"
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_WACHTWOORD:-}
      QUERY_TIMEOUT: "30000"
    volumes:
      - fuseki:/fuseki-base
    labels:
      - traefik.enable=true
      # alleen het SPARQL-leespad publiek; de rest van data.dev gaat naar de api
      - traefik.http.routers.sparql.rule=Host(`data.dev.iotm.nl`) && Path(`/sparql`)
      - traefik.http.routers.sparql.priority=20
      - traefik.http.routers.sparql.tls.certresolver=letsencrypt
      - traefik.http.routers.sparql.middlewares=sparql-pad
      - traefik.http.middlewares.sparql-pad.replacepath.path=/ds/sparql
      - traefik.http.services.sparql.loadbalancer.server.port=3030

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.6
    restart: unless-stopped
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_WACHTWOORD}
      AUTHENTIK_REDIS__HOST: valkey
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_WACHTWOORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${ACME_EMAIL}
      AUTHENTIK_EMAIL__HOST: mailpit
      AUTHENTIK_EMAIL__PORT: 1025
      AUTHENTIK_EMAIL__FROM: noreply@iotm.nl
      # social login (client-ids/secrets uit .env; gebruikt door jottem-social-login.yaml)
      SOCIAL_GOOGLE_CLIENT_ID: ${SOCIAL_GOOGLE_CLIENT_ID:-}
      SOCIAL_GOOGLE_CLIENT_SECRET: ${SOCIAL_GOOGLE_CLIENT_SECRET:-}
      SOCIAL_MICROSOFT_CLIENT_ID: ${SOCIAL_MICROSOFT_CLIENT_ID:-}
      SOCIAL_MICROSOFT_CLIENT_SECRET: ${SOCIAL_MICROSOFT_CLIENT_SECRET:-}
      SOCIAL_FACEBOOK_CLIENT_ID: ${SOCIAL_FACEBOOK_CLIENT_ID:-}
      SOCIAL_FACEBOOK_CLIENT_SECRET: ${SOCIAL_FACEBOOK_CLIENT_SECRET:-}
    volumes:
      - ./authentik-blueprints:/blueprints/custom:ro
      # Jottem-woordmerk in de accountmails (cid:logo; override-pad uit email/utils.py)
      - ./authentik-assets/icon_left_brand.png:/web/icons/icon_left_brand.png:ro
      # mailtemplates in Jottem-huisstijl; /templates staat vóór de ingebouwde templates
      - ./authentik-templates:/templates:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`auth.dev.iotm.nl`)
      - traefik.http.routers.auth.tls.certresolver=letsencrypt
      - traefik.http.services.auth.loadbalancer.server.port=9000

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.6
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    volumes:
      - ./authentik-blueprints:/blueprints/custom:ro
      - ./authentik-assets/icon_left_brand.png:/web/icons/icon_left_brand.png:ro
      - ./authentik-templates:/templates:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ../api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      JOTTEM_DATABASE_URL: postgresql+psycopg://jottem:${POSTGRES_WACHTWOORD}@postgres:5432/jottem
      JOTTEM_VALKEY_URL: redis://valkey:6379/0
      JOTTEM_S3_ENDPOINT: http://minio:9000
      JOTTEM_S3_ENDPOINT_PUBLIEK: ${S3_PUBLIEK:-https://s3.dev.iotm.nl}
      JOTTEM_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      JOTTEM_S3_SECRET_KEY: ${S3_SECRET_KEY}
      JOTTEM_PUBLIEKE_BASIS_URL: ${WEB_PUBLIEK:-https://dev.iotm.nl}
      JOTTEM_API_BASIS_URL: ${API_PUBLIEK:-https://api.dev.iotm.nl}
      JOTTEM_OIDC_ISSUER: https://auth.dev.iotm.nl/application/o/jottem/
      JOTTEM_DEV_AUTH: ${DEV_AUTH:-0}
      JOTTEM_AMR_VERPLICHT: ${AMR_VERPLICHT:-1}
      JOTTEM_IIIF_BASIS_URL: ${IIIF_PUBLIEK:-https://iiif.dev.iotm.nl}
      JOTTEM_HERKENBAAR_URL: http://herkenbaar:4050
      JOTTEM_ANNO_URL: http://annorepo:8080
      JOTTEM_ANNO_BASIS_URL: ${ANNO_PUBLIEK:-https://anno.dev.iotm.nl}
      JOTTEM_ANNO_API_KEY: ${ANNO_API_KEY}
      JOTTEM_FUSEKI_URL: http://fuseki:3030/ds
      JOTTEM_DATA_BASIS_URL: ${DATA_PUBLIEK:-https://data.dev.iotm.nl}
      JOTTEM_SMTP_HOST: mailpit
      JOTTEM_SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.dev.iotm.nl`)
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      # datasetbeschrijving, dump en datacatalogus ook op data.dev (URI-strategie);
      # de rest van data.dev is de statische open-data-pagina (service datapagina)
      - traefik.http.routers.data.rule=Host(`data.dev.iotm.nl`) && (PathPrefix(`/project`) || Path(`/datacatalog`))
      - traefik.http.routers.data.priority=10
      - traefik.http.routers.data.tls.certresolver=letsencrypt
      - traefik.http.routers.data.service=api
      - traefik.http.services.api.loadbalancer.server.port=8000

  worker:
    build: ../api
    restart: unless-stopped
    command: celery -A app.worker worker --beat --loglevel=info
    environment:
      JOTTEM_DATABASE_URL: postgresql+psycopg://jottem:${POSTGRES_WACHTWOORD}@postgres:5432/jottem
      JOTTEM_VALKEY_URL: redis://valkey:6379/0
      JOTTEM_S3_ENDPOINT: http://minio:9000
      JOTTEM_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      JOTTEM_S3_SECRET_KEY: ${S3_SECRET_KEY}
      JOTTEM_PUBLIEKE_BASIS_URL: ${WEB_PUBLIEK:-https://dev.iotm.nl}
      JOTTEM_IIIF_BASIS_URL: ${IIIF_PUBLIEK:-https://iiif.dev.iotm.nl}
      JOTTEM_ANNO_URL: http://annorepo:8080
      JOTTEM_ANNO_BASIS_URL: ${ANNO_PUBLIEK:-https://anno.dev.iotm.nl}
      JOTTEM_ANNO_API_KEY: ${ANNO_API_KEY}
      JOTTEM_FUSEKI_URL: http://fuseki:3030/ds
      JOTTEM_DATA_BASIS_URL: ${DATA_PUBLIEK:-https://data.dev.iotm.nl}
      JOTTEM_SMTP_HOST: mailpit
      JOTTEM_SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIEK:-https://api.dev.iotm.nl}
        NEXT_PUBLIC_DEV_AUTH: ${DEV_AUTH:-0}
    restart: unless-stopped
    environment:
      JOTTEM_API_INTERN: http://api:8000
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`dev.iotm.nl`)
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=3000

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}   # "gebruiker:wachtwoord" voor de web-UI
    labels:
      - traefik.enable=true
      - traefik.http.routers.mail.rule=Host(`mail.dev.iotm.nl`)
      - traefik.http.routers.mail.tls.certresolver=letsencrypt
      - traefik.http.services.mail.loadbalancer.server.port=8025

volumes:
  acme:
  postgres:
  valkey:
  minio:
  mongo:
  fuseki:
