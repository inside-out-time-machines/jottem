# Jottem-stack - draait achter Traefik. Eén bestand voor beide omgevingen: de hostnamen
# leiden af van BASISDOMEIN (en WEB_HOST voor de frontend), en de diensten die alleen in
# de ontwikkelomgeving horen (MinIO, Mailpit) staan in het profiel dev.
#   ontwikkelomgeving: docker compose --profile dev up -d
#   productie:         docker compose --profile prod up -d
# Secrets in .env (zie .env.example), nooit in git.
name: jottem

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # HTTP-01 per hostnaam: poort 80 is open en de DNS wijst al hierheen; dit vermijdt
      # de TransIP-API (gelijktijdige TXT-writes botsen daar) en propagatiewachttijden.
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Prometheus-metrics op een interne entrypoint (niet gepubliceerd)
      - --metrics.prometheus=true
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus.entrypoint=metrics
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jottem
      POSTGRES_PASSWORD: ${POSTGRES_WACHTWOORD}
      POSTGRES_DB: jottem
      AUTHENTIK_DB_WACHTWOORD: ${AUTHENTIK_DB_WACHTWOORD}   # voor het init-script
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jottem"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey:/data

  minio:
    # alleen in de ontwikkelomgeving: in productie staat de objectopslag bij een externe
    # dienst (S3_ENDPOINT en S3_PUBLIEK wijzen daar dan naartoe), dus start deze niet mee
    profiles: ["dev"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # MinIO Console (beheer-GUI) alleen op localhost van de server; bereikbaar via
    # een SSH-tunnel: ssh -L 9001:localhost:9001 idx@coretidx-de -> http://localhost:9001
    # (inloggen met S3_ACCESS_KEY / S3_SECRET_KEY uit .env)
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # Prometheus scrapet minio:9000 binnen het Dockernetwerk; anonieme metrics zijn
      # daar prima, mits het pad niet van buiten bereikbaar is (zie de Traefik-router
      # s3-metrics hieronder, die /minio/v2/ voor de buitenwereld dichtzet).
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.s3.rule=Host(`s3.${BASISDOMEIN}`)
      - traefik.http.routers.s3.tls.certresolver=letsencrypt
      - traefik.http.services.s3.loadbalancer.server.port=9000
      # metrics en beheer-API horen niet op het publieke internet: alleen intern verkeer
      # (Prometheus praat rechtstreeks met minio:9000 en komt hier dus niet langs)
      - traefik.http.routers.s3-metrics.rule=Host(`s3.${BASISDOMEIN}`) && PathPrefix(`/minio/`)
      - traefik.http.routers.s3-metrics.priority=100
      - traefik.http.routers.s3-metrics.tls.certresolver=letsencrypt
      - traefik.http.routers.s3-metrics.service=s3
      - traefik.http.routers.s3-metrics.middlewares=alleen-intern@docker
      - traefik.http.middlewares.alleen-intern.ipallowlist.sourcerange=127.0.0.1/32,172.16.0.0/12

  minio-init:
    profiles: ["dev"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set lokaal http://minio:9000 $S3_ACCESS_KEY $S3_SECRET_KEY &&
             mc mb --ignore-existing lokaal/originals lokaal/derivatives lokaal/thumbs &&
             echo buckets-klaar"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  herkenbaar:
    # detectie van herkenbare personen (portretrecht) - aparte AGPL-dienst, eigen repo
    build: https://github.com/inside-out-time-machines/herkenbaar-api.git
    restart: unless-stopped

  suggesties:
    # suggesties bij het uploaden (titel, categorie, steekwoorden) - eigen repo, EUPL zoals
    # het platform: de modellen zijn MIT en Apache-2.0, dus anders dan bij Herkenbaar werkt
    # er geen AGPL door. Alleen in het dev-profiel zolang de dienst wordt beproefd (V-5).
    profiles: ["dev"]
    build: https://github.com/inside-out-time-machines/suggesties-api.git
    restart: unless-stopped
    environment:
      # meer threads is hier langzamer; zes is op deze machine gemeten het snelst
      SUGGESTIES_THREADS: ${SUGGESTIES_THREADS:-6}
    # de modellen houden ruim 2,5 GB vast; een grens voorkomt dat een geheugenlek de
    # rest van de stack meesleurt
    mem_limit: 6g
    cpus: 8
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4060/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  mongo:
    # database voor AnnoRepo (annotatieserver); niet publiek ontsloten
    image: mongo:6.0.27
    restart: unless-stopped
    volumes:
      - mongo:/data/db

  annorepo:
    # W3C Web Annotation-server (vervangt miiify uit het oorspronkelijke design, dat
    # read-only is geworden); schrijven alleen via de backend-API met de api-key,
    # lezen publiek per container (readOnlyForAnonymousUsers)
    image: ghcr.io/knaw-huc/annorepo-server:0.9.0
    restart: unless-stopped
    environment:
      AR_EXTERNAL_BASE_URL: ${ANNO_PUBLIEK:-https://anno.${BASISDOMEIN}}
      AR_MONGODB_URL: mongodb://mongo/
      AR_DB_NAME: annorepo
      AR_PAGE_SIZE: "100"
      AR_ROOT_API_KEY: ${ANNO_API_KEY}
      AR_PRETTY_PRINT: "false"
    depends_on:
      - mongo
    labels:
      - traefik.enable=true
      - traefik.http.routers.anno.rule=Host(`anno.${BASISDOMEIN}`)
      - traefik.http.routers.anno.tls.certresolver=letsencrypt
      - traefik.http.services.anno.loadbalancer.server.port=8080

  cantaloupe:
    image: uclalibrary/cantaloupe:5.0.7-0
    restart: unless-stopped
    environment:
      CANTALOUPE_BASE_URI: ${IIIF_PUBLIEK:-https://iiif.${BASISDOMEIN}}
      CANTALOUPE_SOURCE_STATIC: S3Source
      CANTALOUPE_S3SOURCE_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      CANTALOUPE_S3SOURCE_REGION: eu-central-1
      CANTALOUPE_S3SOURCE_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      CANTALOUPE_S3SOURCE_SECRET_KEY: ${S3_SECRET_KEY}
      CANTALOUPE_S3SOURCE_BASICLOOKUPSTRATEGY_BUCKET_NAME: derivatives
      CANTALOUPE_ENDPOINT_IIIF_3_ENABLED: "true"
      # bij depublicatie verdwijnt het derivaat uit de bucket. Zonder deze twee bleef
      # Cantaloupe de info.json van een verwijderd beeld uit zijn geheugen serveren;
      # nu controleert hij eerst de bron en gooit hij de cache weg als die weg is (MO-5)
      CANTALOUPE_CACHE_SERVER_RESOLVE_FIRST: "true"
      CANTALOUPE_CACHE_SERVER_PURGE_MISSING: "true"
      JAVA_OPTS: "-Xmx1g"
    depends_on:
      minio:
        condition: service_healthy
        required: false

  varnish:
    image: varnish:7.6
    restart: unless-stopped
    environment:
      VARNISH_SIZE: 512M
      # zonder sleutel weigert de vcl elke PURGE en BAN: publiek verkeer komt via
      # Traefik binnen en zou anders op het interne adres door de acl heen glippen
      VARNISH_BEHEERSLEUTEL: ${VARNISH_BEHEERSLEUTEL}
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    depends_on:
      - cantaloupe
    labels:
      - traefik.enable=true
      - traefik.http.routers.iiif.rule=Host(`iiif.${BASISDOMEIN}`)
      - traefik.http.routers.iiif.tls.certresolver=letsencrypt
      - traefik.http.services.iiif.loadbalancer.server.port=80

  datapagina:
    networks: [default, rdf]
    # statische open-data-landingspagina (repo inside-out-time-machines/data,
    # working copy naast de jottem-checkout: ~/data); alles op data.dev behalve
    # /project/* en /datacatalog (api, prio 10); ook /sparql en /yasgui/ (zie
    # datapagina/default.conf: Fuseki-proxy resp. YASGUI-editor)
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../../data:/usr/share/nginx/html:ro
      - ./datapagina/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=jottem_default
      - traefik.http.routers.datapagina.rule=Host(`data.${BASISDOMEIN}`)
      - traefik.http.routers.datapagina.priority=1
      - traefik.http.routers.datapagina.tls.certresolver=letsencrypt
      - traefik.http.services.datapagina.loadbalancer.server.port=80

  yasgui:
    # SPARQL-editor (Matdata-eu/yasgui); intern geproxyd door datapagina op /yasgui/
    image: mathiasvda/yasgui:latest
    restart: unless-stopped
    environment:
      YASGUI_DEFAULT_ENDPOINT: ${DATA_PUBLIEK:-https://data.${BASISDOMEIN}}/sparql

  fuseki:
    # triplestore voor de RDF-publicatie (schema.org AP NDE); publiek is ALLEEN het
    # /sparql-leespad via de datapagina-nginx, updates lopen intern via de worker.
    # Eigen netwerk: een SPARQL-query mag met SERVICE <...> zelf verbindingen opzetten,
    # dus Fuseki mag alleen bij wie hem aanroept, niet bij MinIO, Postgres of Authentik.
    networks: [rdf]
    image: secoresearch/fuseki:6.2.0
    restart: unless-stopped
    environment:
      ENABLE_DATA_WRITE: "true"
      ENABLE_UPDATE: "true"
      ENABLE_UPLOAD: "false"
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_WACHTWOORD:?zet FUSEKI_ADMIN_WACHTWOORD in .env}
      QUERY_TIMEOUT: "30000"
    volumes:
      - fuseki:/fuseki-base
    # geen Traefik-labels: /sparql loopt via de datapagina-nginx, die
    # machineverkeer naar /ds/sparql proxyt en browsers naar YASGUI stuurt

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.6
    restart: unless-stopped
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      # de blueprints bouwen hun URL's hiermee op (!Env + !Format), zodat een
      # domeinwissel niet in vier yaml-bestanden hoeft. WEB_HOST is de host van de
      # frontend: in dev gelijk aan het basisdomein, in productie www.<basisdomein>
      BASISDOMEIN: ${BASISDOMEIN}
      WEB_HOST: ${WEB_HOST:-${BASISDOMEIN}}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_WACHTWOORD}
      AUTHENTIK_REDIS__HOST: valkey
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_WACHTWOORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${ACME_EMAIL}
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:-mailpit}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-1025}
      AUTHENTIK_EMAIL__FROM: ${MAIL_AFZENDER:-noreply@iotm.nl}
      GRAFANA_OIDC_SECRET: ${GRAFANA_OIDC_SECRET}
      # social login (client-ids/secrets uit .env; gebruikt door jottem-social-login.yaml)
      SOCIAL_GOOGLE_CLIENT_ID: ${SOCIAL_GOOGLE_CLIENT_ID:-}
      SOCIAL_GOOGLE_CLIENT_SECRET: ${SOCIAL_GOOGLE_CLIENT_SECRET:-}
      SOCIAL_MICROSOFT_CLIENT_ID: ${SOCIAL_MICROSOFT_CLIENT_ID:-}
      SOCIAL_MICROSOFT_CLIENT_SECRET: ${SOCIAL_MICROSOFT_CLIENT_SECRET:-}
      SOCIAL_FACEBOOK_CLIENT_ID: ${SOCIAL_FACEBOOK_CLIENT_ID:-}
      SOCIAL_FACEBOOK_CLIENT_SECRET: ${SOCIAL_FACEBOOK_CLIENT_SECRET:-}
    volumes:
      - ./authentik-blueprints:/blueprints/custom:ro
      # Jottem-woordmerk in de accountmails (cid:logo; override-pad uit email/utils.py)
      - ./authentik-assets/icon_left_brand.png:/web/icons/icon_left_brand.png:ro
      # mailtemplates in Jottem-huisstijl; /templates staat vóór de ingebouwde templates
      - ./authentik-templates:/templates:ro
      # tutoyeer-patch op de Nederlandse web-UI-vertaling (zie authentik-locale/
      # patch-locale.sh); de chunknaam wisselt per release: script opnieuw draaien
      - ./authentik-locale/chunks/H73SQ3W6.js:/web/dist/src/locales/chunks/H73SQ3W6.js:ro
      # idem voor de backend-catalogus (Django gettext, zie patch-backend-locale.sh):
      # vult msgid's aan die upstream nog onvertaald zijn
      - ./authentik-locale/backend/nl-django.mo:/locale/nl/LC_MESSAGES/django.mo:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`auth.${BASISDOMEIN}`)
      - traefik.http.routers.auth.tls.certresolver=letsencrypt
      - traefik.http.services.auth.loadbalancer.server.port=9000

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.6
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    volumes:
      - ./authentik-blueprints:/blueprints/custom:ro
      - ./authentik-assets/icon_left_brand.png:/web/icons/icon_left_brand.png:ro
      - ./authentik-templates:/templates:ro
      # zelfde backend-vertaalpatch als op de server (mails renderen hier)
      - ./authentik-locale/backend/nl-django.mo:/locale/nl/LC_MESSAGES/django.mo:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    networks: [default, rdf]
    build: ../api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      JOTTEM_DATABASE_URL: postgresql+psycopg://jottem:${POSTGRES_WACHTWOORD}@postgres:5432/jottem
      JOTTEM_VALKEY_URL: redis://valkey:6379/0
      JOTTEM_S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      JOTTEM_S3_ENDPOINT_PUBLIEK: ${S3_PUBLIEK:-https://s3.${BASISDOMEIN}}
      JOTTEM_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      JOTTEM_S3_SECRET_KEY: ${S3_SECRET_KEY}
      JOTTEM_PUBLIEKE_BASIS_URL: ${WEB_PUBLIEK:-https://${WEB_HOST:-${BASISDOMEIN}}}
      JOTTEM_API_BASIS_URL: ${API_PUBLIEK:-https://api.${BASISDOMEIN}}
      JOTTEM_OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.${BASISDOMEIN}/application/o/jottem/}
      JOTTEM_DEV_AUTH: ${DEV_AUTH:-0}
      # bij een lege database wordt dit adres platformbeheerder (uitnodigingspatroon)
      JOTTEM_BOOTSTRAP_BEHEERDER: ${BOOTSTRAP_BEHEERDER:-}
      JOTTEM_AMR_VERPLICHT: ${AMR_VERPLICHT:-1}
      JOTTEM_IIIF_BASIS_URL: ${IIIF_PUBLIEK:-https://iiif.${BASISDOMEIN}}
      JOTTEM_VARNISH_URL: http://varnish
      JOTTEM_VARNISH_SLEUTEL: ${VARNISH_BEHEERSLEUTEL}
      JOTTEM_HERKENBAAR_URL: http://herkenbaar:4050
      JOTTEM_SUGGESTIES_URL: ${SUGGESTIES_URL:-http://suggesties:4060}
      JOTTEM_ANNO_URL: http://annorepo:8080
      JOTTEM_ANNO_BASIS_URL: ${ANNO_PUBLIEK:-https://anno.${BASISDOMEIN}}
      JOTTEM_ANNO_API_KEY: ${ANNO_API_KEY}
      JOTTEM_FUSEKI_URL: http://fuseki:3030/ds
      JOTTEM_DATA_BASIS_URL: ${DATA_PUBLIEK:-https://data.${BASISDOMEIN}}
      JOTTEM_SMTP_HOST: ${SMTP_HOST:-mailpit}
      JOTTEM_SMTP_PORT: ${SMTP_PORT:-1025}
      JOTTEM_MAIL_AFZENDER: ${MAIL_AFZENDER:-noreply@iotm.nl}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
        required: false
    labels:
      - traefik.enable=true
      - traefik.docker.network=jottem_default
      - traefik.http.routers.api.rule=Host(`api.${BASISDOMEIN}`)
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      # datasetbeschrijving, dump, datacatalogus en de naamsruimte (het vocabulaire
      # achter jottem: plus de frames) ook op data.dev (URI-strategie); de rest van
      # data.dev is de statische open-data-pagina (service datapagina)
      - traefik.http.routers.data.rule=Host(`data.${BASISDOMEIN}`) && (PathPrefix(`/project`) || Path(`/datacatalog`) || PathPrefix(`/ns`))
      - traefik.http.routers.data.priority=10
      - traefik.http.routers.data.tls.certresolver=letsencrypt
      - traefik.http.routers.data.service=api
      - traefik.http.services.api.loadbalancer.server.port=8000

  worker:
    networks: [default, rdf]
    build: ../api
    restart: unless-stopped
    command: celery -A app.worker worker --beat --loglevel=info
    environment:
      JOTTEM_DATABASE_URL: postgresql+psycopg://jottem:${POSTGRES_WACHTWOORD}@postgres:5432/jottem
      JOTTEM_VALKEY_URL: redis://valkey:6379/0
      JOTTEM_S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # de worker maakt presigned URL's (s3.py) en de uitschrijflink in attenderingsmails
      # (worker.py), dus hij heeft dezelfde publieke basis-URL's nodig als de api
      JOTTEM_S3_ENDPOINT_PUBLIEK: ${S3_PUBLIEK:-https://s3.${BASISDOMEIN}}
      JOTTEM_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      JOTTEM_S3_SECRET_KEY: ${S3_SECRET_KEY}
      JOTTEM_PUBLIEKE_BASIS_URL: ${WEB_PUBLIEK:-https://${WEB_HOST:-${BASISDOMEIN}}}
      JOTTEM_API_BASIS_URL: ${API_PUBLIEK:-https://api.${BASISDOMEIN}}
      JOTTEM_IIIF_BASIS_URL: ${IIIF_PUBLIEK:-https://iiif.${BASISDOMEIN}}
      JOTTEM_VARNISH_URL: http://varnish
      JOTTEM_VARNISH_SLEUTEL: ${VARNISH_BEHEERSLEUTEL}
      JOTTEM_ANNO_URL: http://annorepo:8080
      JOTTEM_ANNO_BASIS_URL: ${ANNO_PUBLIEK:-https://anno.${BASISDOMEIN}}
      JOTTEM_ANNO_API_KEY: ${ANNO_API_KEY}
      JOTTEM_FUSEKI_URL: http://fuseki:3030/ds
      JOTTEM_DATA_BASIS_URL: ${DATA_PUBLIEK:-https://data.${BASISDOMEIN}}
      JOTTEM_SMTP_HOST: ${SMTP_HOST:-mailpit}
      JOTTEM_SMTP_PORT: ${SMTP_PORT:-1025}
      JOTTEM_MAIL_AFZENDER: ${MAIL_AFZENDER:-noreply@iotm.nl}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIEK:-https://api.${BASISDOMEIN}}
        # NEXT_PUBLIC_* is build-time: de waarden worden in de clientbundel gebakken, dus
        # een domeinwissel vraagt altijd een herbouw (docker compose up -d --build web)
        NEXT_PUBLIC_SITE_URL: ${WEB_PUBLIEK:-https://${WEB_HOST:-${BASISDOMEIN}}}
        NEXT_PUBLIC_DATA_URL: ${DATA_PUBLIEK:-https://data.${BASISDOMEIN}}
        # 'dev' toont de omgevingsbadge en de disclaimer in de voettekst; 'productie' niet
        NEXT_PUBLIC_OMGEVING: ${OMGEVING:-dev}
        NEXT_PUBLIC_DEV_AUTH: ${DEV_AUTH:-0}
        # de browser had de issuer nooit meegekregen en viel terug op de compile-time
        # standaard uit web/Dockerfile: bij een ander domein logde je op dev in
        NEXT_PUBLIC_OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.${BASISDOMEIN}/application/o/jottem/}
        # welke dev-identiteit de bypass gebruikt (alleen zinvol met DEV_AUTH=1)
        NEXT_PUBLIC_DEV_SUB: ${DEV_SUB:-dev-piet}
    restart: unless-stopped
    environment:
      JOTTEM_API_INTERN: http://api:8000
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${WEB_HOST:-${BASISDOMEIN}}`)
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=3000

  apex-redirect:
    # alleen in productie: daar is de frontend www.iotm.nl en moet de kale iotm.nl
    # doorverwijzen. In dev is WEB_HOST gelijk aan BASISDOMEIN en bestaat deze router niet.
    profiles: ["prod"]
    image: traefik/whoami:v1.10
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.web-apex.rule=Host(`${BASISDOMEIN}`)
      - traefik.http.routers.web-apex.tls.certresolver=letsencrypt
      - traefik.http.routers.web-apex.middlewares=naar-www@docker
      - traefik.http.middlewares.naar-www.redirectregex.regex=^https?://[^/]+/(.*)
      - traefik.http.middlewares.naar-www.redirectregex.replacement=https://${WEB_HOST:-${BASISDOMEIN}}/$${1}
      - traefik.http.middlewares.naar-www.redirectregex.permanent=true
      - traefik.http.services.web-apex.loadbalancer.server.port=80

  mailpit:
    # alleen in de ontwikkelomgeving: in productie loopt mail via de eigen MTA (SMTP_HOST)
    profiles: ["dev"]
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # Mailpit staat op een publieke hostnaam en vangt óók de wachtwoordherstelmails van
      # Authentik op. Een lege waarde zou de mailbox voor iedereen openzetten, dus is de
      # variabele verplicht: zonder waarde weigert compose te starten.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?zet MAILPIT_UI_AUTH in .env (gebruiker:bcrypt-hash of gebruiker:wachtwoord)}
    labels:
      - traefik.enable=true
      - traefik.http.routers.mail.rule=Host(`mail.${BASISDOMEIN}`)
      - traefik.http.routers.mail.tls.certresolver=letsencrypt
      - traefik.http.services.mail.loadbalancer.server.port=8025

  # ---------- monitoring (realisatieplan, blok Fundament) ----------

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://jottem:${POSTGRES_WACHTWOORD}@postgres:5432/jottem?sslmode=disable

  valkey-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://valkey:6379

  prometheus:
    image: prom/prometheus:v2.53.4
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    # GUI voor de monitoring; inloggen via Authentik (OIDC), alleen leden van de
    # Authentik-groep Platformbeheerders (role_attribute_strict weigert de rest)
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://status.${BASISDOMEIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_WACHTWOORD}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-mailpit}:${SMTP_PORT:-1025}
      GF_SMTP_FROM_ADDRESS: ${MONITORING_AFZENDER:-grafana@iotm.nl}
      GF_SMTP_FROM_NAME: Jottem-monitoring
      GF_SMTP_SKIP_VERIFY: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Authentik
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.${BASISDOMEIN}/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.${BASISDOMEIN}/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.${BASISDOMEIN}/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'Platformbeheerders') && 'Admin'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
    extra_hosts:
      # hairpin: de token-exchange naar de auth-host moet via de host (Traefik)
      - "auth.${BASISDOMEIN}:host-gateway"
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`status.${BASISDOMEIN}`)
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.services.grafana.loadbalancer.server.port=3000

volumes:
  acme:
  postgres:
  valkey:
  minio:
  mongo:
  fuseki:
  prometheus:
  grafana:

networks:
  # standaardnetwerk blijft impliciet; `rdf` is het smalle netwerk rond Fuseki
  rdf:
    driver: bridge
