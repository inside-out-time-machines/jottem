# Service-account waarmee de Jottem-API accounts aanmaakt voor uitgenodigde leden van
# besloten projecten (ontwerp: OB-8, systeemarchitectuur "Leden van besloten projecten").
# Het account krijgt alleen de rechten om gebruikers aan te maken en op te zoeken; het
# API-token komt uit .env (JOTTEM_AUTHENTIK_TOKEN) en verloopt niet. Dit is de enige plek
# waar de backend naar Authentik schrijft; autorisatie blijft in de database.
# Alleen !Find gebruiken (zie README: !KeyOf maskeert fouten in de logging).
version: 1
metadata:
  name: jottem-api-serviceaccount
  labels:
    blueprints.goauthentik.io/description: "Service-account + API-token voor de Jottem-API (accounts aanmaken bij projectuitnodiging)"
entries:
  - model: authentik_core.user
    identifiers:
      username: jottem-api
    state: present
    attrs:
      name: Jottem API (service-account)
      type: internal_service_account
      path: jottem/service
      is_active: true
      permissions:
        - authentik_core.add_user
        - authentik_core.view_user

  - model: authentik_core.token
    identifiers:
      identifier: jottem-api-token
    state: present
    attrs:
      user: !Find [authentik_core.user, [username, jottem-api]]
      intent: api
      expiring: false
      description: "API-token van de Jottem-API (zie deploy/.env JOTTEM_AUTHENTIK_TOKEN)"
      key: !Env JOTTEM_AUTHENTIK_TOKEN
