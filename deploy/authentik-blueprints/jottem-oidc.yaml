# Declaratieve Authentik-configuratie voor Jottem (toegepast door de authentik-worker).
# Maakt de OAuth2/OIDC-provider (public client + PKCE) en de applicatie "jottem" aan;
# issuer wordt daarmee https://auth.<BASISDOMEIN>/application/o/jottem/.
version: 1
metadata:
  name: jottem-oidc
  labels:
    blueprints.goauthentik.io/description: "Jottem webfrontend (OIDC, code + PKCE)"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: jottem-provider
    identifiers:
      name: jottem-web
    state: present
    attrs:
      client_type: public
      client_id: jottem-web
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      # de flow mét user-logout-stage: uitloggen in de webapp beëindigt ook de
      # Authentik-sessie (bewust; de provider-variant liet die staan, waardoor
      # opnieuw inloggen stilzwijgend dezelfde gebruiker aanmeldde)
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: hours=1
      refresh_token_validity: days=7
      sub_mode: hashed_user_id
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://%s/auth/callback", !Env [WEB_HOST, dev.iotm.nl]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]

  - model: authentik_core.application
    identifiers:
      slug: jottem
    state: present
    attrs:
      name: Jottem
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, jottem-web]]
      # ?sso=1 laat de frontend automatisch de OIDC-flow starten (sessie bestaat al)
      meta_launch_url: !Format ["https://%s/?sso=1", !Env [WEB_HOST, dev.iotm.nl]]
      policy_engine_mode: any
