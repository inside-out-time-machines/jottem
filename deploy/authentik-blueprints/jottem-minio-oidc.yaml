# MinIO Console achter Authentik (OIDC). Alleen leden van de groep
# "Platformbeheerders" (zie jottem-grafana-oidc.yaml) mogen de applicatie in;
# wie erdoor komt krijgt via de claim `policy: consoleAdmin` volledige
# consolerechten in MinIO (MinIO leest die claim, zie docker-compose.yml).
version: 1
metadata:
  name: jottem-minio-oidc
  labels:
    blueprints.goauthentik.io/description: "MinIO Console (OIDC) voor platformbeheerders"
entries:
  # extra scope die de MinIO-policyclaim aan het token toevoegt
  - model: authentik_providers_oauth2.scopemapping
    id: minio-policy-scope
    identifiers:
      name: minio-policy
    state: present
    attrs:
      scope_name: minio
      description: "MinIO-consolerechten"
      expression: |
        return {"policy": "consoleAdmin"}

  - model: authentik_providers_oauth2.oauth2provider
    id: minio-provider
    identifiers:
      name: minio
    state: present
    attrs:
      client_type: confidential
      client_id: minio
      client_secret: !Env MINIO_OIDC_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: hours=1
      redirect_uris:
        - matching_mode: strict
          url: https://s3-admin.dev.iotm.nl/oauth_callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !KeyOf minio-policy-scope

  - model: authentik_core.application
    id: minio-app
    identifiers:
      slug: minio
    state: present
    attrs:
      name: MinIO Console
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, minio]]
      meta_launch_url: https://s3-admin.dev.iotm.nl/
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf minio-app
      order: 0
    state: present
    attrs:
      group: !Find [authentik_core.group, [name, Platformbeheerders]]
