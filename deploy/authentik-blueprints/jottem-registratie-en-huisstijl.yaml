# Self-service-registratie (met e-mailverificatie, conform het design: accountmails via
# Authentik) en de Jottem-huisstijl op de publieke Authentik-pagina's (Brand).
version: 1
metadata:
  name: jottem-registratie-en-huisstijl
  labels:
    blueprints.goauthentik.io/description: "Registratieflow + Jottem-branding"
entries:
  # ---------- huisstijl (Brand) ----------
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    state: present
    attrs:
      branding_title: Jottem
      branding_logo: https://dev.iotm.nl/logo/jottem-woordmerk.svg
      branding_favicon: https://dev.iotm.nl/favicon.ico
      attributes:
        settings:
          locale: nl
      # brand-tokens (merkgids) voor alle Authentik-interfaces: flows, gebruikers- en
      # beheerinterface. Fonts komen van dev.iotm.nl (CORS-header op /fonts in Next.js);
      # de @font-face werkt op documentniveau, de shadow-DOM-componenten erven de familie.
      # Defensief: alleen kleuren, fonts en randen; geen layout-ingrepen, zodat een
      # Authentik-upgrade hooguit stilletjes terugvalt op de standaardstijl.
      branding_custom_css: |
        @font-face {
          font-family: 'Albert Sans'; font-style: normal; font-weight: 400;
          font-display: swap;
          src: url('https://dev.iotm.nl/fonts/albert-sans-v4-latin-regular.woff2') format('woff2');
        }
        @font-face {
          font-family: 'Albert Sans'; font-style: normal; font-weight: 500;
          font-display: swap;
          src: url('https://dev.iotm.nl/fonts/albert-sans-v4-latin-500.woff2') format('woff2');
        }
        @font-face {
          font-family: 'Albert Sans'; font-style: normal; font-weight: 600;
          font-display: swap;
          src: url('https://dev.iotm.nl/fonts/albert-sans-v4-latin-600.woff2') format('woff2');
        }
        @font-face {
          font-family: 'Fraunces'; font-style: normal; font-weight: 600;
          font-display: swap;
          src: url('https://dev.iotm.nl/fonts/fraunces-v38-latin-600.woff2') format('woff2');
        }
        @font-face {
          font-family: 'Fraunces'; font-style: normal; font-weight: 700;
          font-display: swap;
          src: url('https://dev.iotm.nl/fonts/fraunces-v38-latin-700.woff2') format('woff2');
        }
        :root {
          --jottem-oranje: #d85a30;
          --jottem-oranje-donker: #c04e28;
          --jottem-roest: #a2401f;
          --jottem-papier: #faf6f1;
          --jottem-karton: #e8d9c4;
          --jottem-inkt: #1f1e1c;
          accent-color: #a2401f;
          /* PatternFly-brede tokens: fonts, focus- en linkkleuren */
          --pf-global--FontFamily--sans-serif: 'Albert Sans', Arial, sans-serif;
          --pf-global--FontFamily--heading--sans-serif: 'Fraunces', Georgia, serif;
          --pf-global--primary-color--100: var(--jottem-oranje);
          --pf-global--primary-color--200: var(--jottem-oranje-donker);
          --pf-global--active-color--100: var(--jottem-oranje);
          --pf-global--link--Color: var(--jottem-roest);
          --pf-global--link--Color--hover: var(--jottem-oranje-donker);
          /* link-knoppen (o.a. social login) lezen hun kleur uit deze component-var */
          --pf-c-button--m-link--Color: var(--jottem-roest);
          --pf-c-button--m-link--hover--Color: var(--jottem-oranje-donker);
        }
        body, .pf-c-form, .pf-c-form-control, .pf-c-button, input, button, select, textarea {
          font-family: 'Albert Sans', Arial, sans-serif;
        }
        .pf-c-title, .pf-c-login__main-header h1, .pf-c-content h1, .pf-c-content h2 {
          font-family: 'Fraunces', Georgia, serif;
        }
        .pf-c-button.pf-m-primary { background-color: var(--jottem-oranje); }
        .pf-c-button.pf-m-primary:hover,
        .pf-c-button.pf-m-primary:focus { background-color: var(--jottem-oranje-donker); }
        .pf-c-button.pf-m-secondary {
          color: var(--jottem-roest);
          border: 1px solid var(--jottem-roest);
        }
        .pf-c-button.pf-m-link { color: var(--jottem-roest); }
        .pf-c-login__main {
          border-top: 4px solid var(--jottem-oranje);
          border-radius: 6px;
          box-shadow: 0 6px 24px rgba(31, 30, 28, 0.12);
        }
        .pf-c-form-control { border-radius: 4px; }
        a { color: var(--jottem-roest); }
        .pf-c-page { --pf-c-page--BackgroundColor: var(--jottem-papier); }
        .pf-c-nav__link.pf-m-current { border-left-color: var(--jottem-oranje); }

  # Nederlandse titel + papieren achtergrond op de bestaande loginflow
  - model: authentik_flows.flow
    identifiers:
      slug: default-authentication-flow
    state: present
    attrs:
      title: "Welkom bij Jottem"
      background: https://dev.iotm.nl/papier.png

  # papieren achtergrond op alle overige flows die in de gebruikersreis voorbij kunnen
  # komen (consent, social-login-terugkeer, uitloggen, wachtwoord, instellingen), zodat
  # nergens de standaard Authentik-foto opduikt
  - model: authentik_flows.flow
    identifiers: {slug: default-provider-authorization-implicit-consent}
    state: present
    attrs: {background: https://dev.iotm.nl/papier.png}
  - model: authentik_flows.flow
    identifiers: {slug: default-provider-authorization-explicit-consent}
    state: present
    attrs: {background: https://dev.iotm.nl/papier.png}
  - model: authentik_flows.flow
    identifiers: {slug: default-source-authentication}
    state: present
    attrs: {background: https://dev.iotm.nl/papier.png}
  - model: authentik_flows.flow
    identifiers: {slug: default-source-enrollment}
    state: present
    attrs: {background: https://dev.iotm.nl/papier.png}
  - model: authentik_flows.flow
    identifiers: {slug: default-source-pre-authentication}
    state: present
    attrs: {background: https://dev.iotm.nl/papier.png}
  - model: authentik_flows.flow
    identifiers: {slug: default-invalidation-flow}
    state: present
    attrs: {background: https://dev.iotm.nl/papier.png}
  - model: authentik_flows.flow
    identifiers: {slug: default-provider-invalidation-flow}
    state: present
    attrs: {background: https://dev.iotm.nl/papier.png}
  - model: authentik_flows.flow
    identifiers: {slug: default-password-change}
    state: present
    attrs: {background: https://dev.iotm.nl/papier.png}
  - model: authentik_flows.flow
    identifiers: {slug: default-user-settings-flow}
    state: present
    attrs: {background: https://dev.iotm.nl/papier.png}
  - model: authentik_flows.flow
    identifiers: {slug: default-authenticator-static-setup}
    state: present
    attrs: {background: https://dev.iotm.nl/papier.png}

# Nederlandse titels + papieren achtergrond op de MFA-setup-flows (TOTP en passkey);
  # de flows en stages zelf zijn Authentik-standaard en al gekoppeld (configure_flow)
  - model: authentik_flows.flow
    identifiers:
      slug: default-authenticator-totp-setup
    state: present
    attrs:
      title: "Stel tweestapsverificatie in (authenticator-app)"
      background: https://dev.iotm.nl/papier.png
  - model: authentik_flows.flow
    identifiers:
      slug: default-authenticator-webauthn-setup
    state: present
    attrs:
      title: "Stel je passkey in"
      background: https://dev.iotm.nl/papier.png

  # ---------- prompts voor de registratie ----------
  - model: authentik_stages_prompt.prompt
    id: prompt-naam
    identifiers:
      field_key: name
      name: jottem-registratie-naam
    attrs:
      label: Naam
      type: text
      required: true
      placeholder: "Je naam (zoals anderen die zien)"
      order: 10

  - model: authentik_stages_prompt.prompt
    id: prompt-email
    identifiers:
      field_key: email
      name: jottem-registratie-email
    attrs:
      label: E-mailadres
      type: email
      required: true
      placeholder: "naam@voorbeeld.nl"
      order: 20

  - model: authentik_stages_prompt.prompt
    id: prompt-username
    identifiers:
      field_key: username
      name: jottem-registratie-gebruikersnaam
    attrs:
      label: Gebruikersnaam
      type: text
      required: true
      placeholder: "Voor het inloggen"
      order: 30

  - model: authentik_stages_prompt.prompt
    id: prompt-wachtwoord
    identifiers:
      field_key: password
      name: jottem-registratie-wachtwoord
    attrs:
      label: Wachtwoord
      type: password
      required: true
      placeholder: Wachtwoord
      order: 40

  - model: authentik_stages_prompt.prompt
    id: prompt-wachtwoord-herhaal
    identifiers:
      field_key: password_repeat
      name: jottem-registratie-wachtwoord-herhaal
    attrs:
      label: Wachtwoord (nog een keer)
      type: password
      required: true
      placeholder: Wachtwoord herhalen
      order: 50

  # ---------- stages ----------
  - model: authentik_stages_prompt.promptstage
    id: stage-gegevens
    identifiers:
      name: jottem-registratie-gegevens
    attrs:
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, jottem-registratie-naam]]
        - !Find [authentik_stages_prompt.prompt, [name, jottem-registratie-email]]
        - !Find [authentik_stages_prompt.prompt, [name, jottem-registratie-gebruikersnaam]]
        - !Find [authentik_stages_prompt.prompt, [name, jottem-registratie-wachtwoord]]
        - !Find [authentik_stages_prompt.prompt, [name, jottem-registratie-wachtwoord-herhaal]]

  - model: authentik_stages_user_write.userwritestage
    id: stage-aanmaken
    identifiers:
      name: jottem-registratie-aanmaken
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: true
      # interne gebruikers: externe gebruikers mogen het Authentik-portaal niet in
      user_type: internal

  - model: authentik_stages_email.emailstage
    id: stage-verificatie
    identifiers:
      name: jottem-registratie-verificatie
    attrs:
      use_global_settings: true
      activate_user_on_success: true
      subject: "Bevestig je Jottem-account"
      template: email/account_confirmation.html
      token_expiry: minutes=30

  - model: authentik_stages_user_login.userloginstage
    id: stage-inloggen
    identifiers:
      name: jottem-registratie-inloggen
    attrs: {}

  # ---------- de flow zelf ----------
  - model: authentik_flows.flow
    id: flow-registratie
    identifiers:
      slug: jottem-registratie
    attrs:
      name: Jottem-registratie
      title: "Maak je Jottem-account"
      designation: enrollment
      authentication: require_unauthenticated
      background: https://dev.iotm.nl/papier.png

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, jottem-registratie]]
      order: 10
    attrs:
      stage: !Find [authentik_stages_prompt.promptstage, [name, jottem-registratie-gegevens]]
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, jottem-registratie]]
      order: 20
    attrs:
      stage: !Find [authentik_stages_user_write.userwritestage, [name, jottem-registratie-aanmaken]]
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, jottem-registratie]]
      order: 30
    attrs:
      stage: !Find [authentik_stages_email.emailstage, [name, jottem-registratie-verificatie]]
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, jottem-registratie]]
      order: 40
    attrs:
      stage: !Find [authentik_stages_user_login.userloginstage, [name, jottem-registratie-inloggen]]

  # ---------- registratielink op de loginpagina ----------
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    state: present
    attrs:
      # user_fields expliciet meegeven: de serializer valideert het hele object en
      # zou ze anders leegmaken ("at least one source must be selected")
      user_fields: [email, username]
      enrollment_flow: !Find [authentik_flows.flow, [slug, jottem-registratie]]
