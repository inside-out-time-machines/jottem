# Grafana achter Authentik (OIDC, confidential client). Alleen leden van de
# Authentik-groep "Platformbeheerders" mogen de applicatie in (binding hieronder)
# en worden in Grafana Admin (role_attribute_path in docker-compose.yml).
# De groep wordt handmatig beheerd in Authentik; akadmin zit er standaard in.
version: 1
metadata:
  name: jottem-grafana-oidc
  labels:
    blueprints.goauthentik.io/description: "Grafana (OIDC) voor platformbeheerders"
entries:
  - model: authentik_core.group
    id: groep-platformbeheerders
    identifiers:
      name: Platformbeheerders
    state: present
    attrs:
      users:
        - !Find [authentik_core.user, [username, akadmin]]

  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: grafana
    state: present
    attrs:
      client_type: confidential
      client_id: grafana
      client_secret: !Env GRAFANA_OIDC_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: hours=1
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://status.%s/login/generic_oauth", !Env [BASISDOMEIN, dev.iotm.nl]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]

  - model: authentik_core.application
    id: grafana-app
    identifiers:
      slug: grafana
    state: present
    attrs:
      name: Grafana
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, grafana]]
      meta_launch_url: !Format ["https://status.%s/", !Env [BASISDOMEIN, dev.iotm.nl]]
      policy_engine_mode: any

  # alleen de groep Platformbeheerders mag de applicatie gebruiken
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana-app
      order: 0
    state: present
    attrs:
      group: !Find [authentik_core.group, [name, Platformbeheerders]]
