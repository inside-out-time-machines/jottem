# Open-data-landingspagina (repo inside-out-time-machines/data).
# /openapi.yaml wordt geproxyd naar design.iotm.nl zodat Swagger UI de spec
# same-origin kan laden (single source of truth, geen CORS nodig).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # .webmanifest kent nginx standaard niet; default_type geldt alleen voor
    # extensies buiten mime.types, dus dit raakt uitsluitend dit bestand
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # Docker-DNS: nodig omdat de proxy-doelen via variabelen lopen (runtime-
    # resolutie; zo start nginx ook als fuseki/yasgui nog niet draaien)
    resolver 127.0.0.11 valid=10s;

    location = /openapi.yaml {
        proxy_pass https://design.iotm.nl/openapi.yaml;
        proxy_ssl_server_name on;
        proxy_set_header Host design.iotm.nl;
    }

    # SPARQL-endpoint (Fuseki, alleen lezen): machineverkeer gaat door naar
    # /ds/sparql; een browser die zonder query aanklopt (GET, lege querystring,
    # Accept: text/html) krijgt de YASGUI-editor met dit endpoint voorgevuld
    # (zelfde gedrag als sparql.goudatijdmachine.nl)
    location = /sparql {
        set $naar_editor 0;
        if ($http_accept ~* "text/html") { set $naar_editor 1; }
        if ($args != "")                 { set $naar_editor 0; }
        if ($request_method != GET)      { set $naar_editor 0; }
        if ($naar_editor = 1) {
            return 302 https://data.dev.iotm.nl/yasgui/?endpoint=https://data.dev.iotm.nl/sparql;
        }
        set $fuseki http://fuseki:3030;
        proxy_pass $fuseki/ds/sparql$is_args$args;
    }

    # YASGUI (image mathiasvda/yasgui, zie github.com/Matdata-eu/yasgui)
    location /yasgui/ {
        set $yasgui http://yasgui:8080;
        rewrite ^/yasgui/(.*)$ /$1 break;
        proxy_pass $yasgui;
    }
}
