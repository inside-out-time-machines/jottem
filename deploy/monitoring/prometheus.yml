# Prometheus-scrapeconfig voor de Jottem dev-stack (zie realisatieplan, blok Fundament).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: containers
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: traefik
    static_configs: [{ targets: ["traefik:8082"] }]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{ targets: ["minio:9000"] }]
  - job_name: minio-buckets
    metrics_path: /minio/v2/metrics/bucket
    static_configs: [{ targets: ["minio:9000"] }]
  - job_name: authentik
    static_configs: [{ targets: ["authentik-server:9300"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: valkey
    static_configs: [{ targets: ["valkey-exporter:9121"] }]
